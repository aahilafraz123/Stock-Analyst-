# One-command local stack:  docker compose up --build
# then open http://localhost:5173  (API docs: http://localhost:8000/docs)
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env  # copy backend/.env.example and add your keys
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - analyzer-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  analyzer-data:
